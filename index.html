<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="rock">Rock</button>
    <button class="paper">Paper</button>
    <button class="scissors">Scissors</button>
    <div class="choice">
        <div id="humanChoice">Your Choice is <span id="humanChoice"></span></div>
        <div id="computerChoice">Computer Choice is <span id="computerChoice"></span></div>
    </div>
    <div class="score">
        <div id="humanScore">Human Score : <span id="humanScore">0</span></div>
        <div id="computerScore">Computer Score : <span id="computerScore">0</span></div>
    </div>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
